<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f24"/>
      <stop offset="1" stop-color="#13203f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4d"/>
      <stop offset="1" stop-color="#152141"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#63b3ed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4fd1c5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="90" cy="60" r="1.3"/><circle cx="230" cy="40" r="1"/><circle cx="380" cy="75" r="1.4"/>
    <circle cx="540" cy="35" r="1"/><circle cx="700" cy="70" r="1.2"/><circle cx="860" cy="45" r="1"/>
    <circle cx="1010" cy="65" r="1.4"/><circle cx="1130" cy="40" r="1"/><circle cx="160" cy="100" r="1"/>
    <circle cx="980" cy="110" r="1.1"/><circle cx="1090" cy="95" r="1"/><circle cx="60" cy="130" r="1"/>
  </g>

  <!-- Title -->
  <text x="600" y="78" text-anchor="middle" font-size="40" font-weight="700" fill="#ffffff">
    Deep-Space Photonics Thermal Advisor
  </text>
  <text x="600" y="112" text-anchor="middle" font-size="18" fill="#9fb3d1">
    Tool-Using Agent + Physics Simulator for Thermal Mitigation in Photonic Instruments
  </text>

  <!-- Pipeline panels -->
  <!-- 1. Physics Simulator -->
  <g>
    <rect x="40" y="170" width="250" height="170" rx="14" fill="url(#panel)" stroke="#2f4675" stroke-width="1.5"/>
    <text x="165" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#4fd1c5">Physics Simulator</text>
    <text x="165" y="240" text-anchor="middle" font-size="16" fill="#e6edf7">&#916;n = dn/dT &#215; &#916;T</text>
    <text x="165" y="266" text-anchor="middle" font-size="16" fill="#e6edf7">&#949; = &#945; &#215; &#916;T</text>
    <text x="165" y="300" text-anchor="middle" font-size="13" fill="#9fb3d1">Refractive shift, strain</text>
    <text x="165" y="320" text-anchor="middle" font-size="13" fill="#9fb3d1">&amp; risk from first principles</text>
  </g>

  <!-- 2. Tool-Using Agent -->
  <g>
    <rect x="320" y="170" width="250" height="170" rx="14" fill="url(#panel)" stroke="#2f4675" stroke-width="1.5"/>
    <text x="445" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#4fd1c5">Tool-Using Agent</text>
    <text x="445" y="232" text-anchor="middle" font-size="14" fill="#e6edf7">Reason &#8594; act tool-use loop</text>
    <text x="445" y="262" text-anchor="middle" font-size="13" fill="#9fb3d1">Bedrock backend (managed)</text>
    <text x="445" y="284" text-anchor="middle" font-size="13" fill="#9fb3d1">or Local backend</text>
    <text x="445" y="306" text-anchor="middle" font-size="13" fill="#9fb3d1">(fine-tuned GGUF)</text>
  </g>

  <!-- 3. Scenario Data Store -->
  <g>
    <rect x="600" y="170" width="250" height="170" rx="14" fill="url(#panel)" stroke="#2f4675" stroke-width="1.5"/>
    <text x="725" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#4fd1c5">Scenario Data Store</text>
    <text x="725" y="234" text-anchor="middle" font-size="14" fill="#e6edf7">TF-IDF retrieval</text>
    <text x="725" y="262" text-anchor="middle" font-size="14" fill="#e6edf7">40,000 scenarios</text>
    <text x="725" y="296" text-anchor="middle" font-size="13" fill="#9fb3d1">Similar prior cases</text>
    <text x="725" y="316" text-anchor="middle" font-size="13" fill="#9fb3d1">&amp; proven strategies</text>
  </g>

  <!-- 4. XGBoost Classifier -->
  <g>
    <rect x="880" y="170" width="280" height="170" rx="14" fill="url(#panel)" stroke="#2f4675" stroke-width="1.5"/>
    <text x="1020" y="196" text-anchor="middle" font-size="17" font-weight="700" fill="#4fd1c5">XGBoost Classifier</text>
    <text x="1020" y="232" text-anchor="middle" font-size="14" fill="#e6edf7">Strategy prediction</text>
    <text x="1020" y="262" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">Passive &#183; Active &#183; Hybrid</text>
    <text x="1020" y="298" text-anchor="middle" font-size="13" fill="#9fb3d1">Calibrated probabilities</text>
  </g>

  <!-- Flow arrows between panels -->
  <g stroke="#4fd1c5" stroke-width="2" fill="none">
    <line x1="293" y1="255" x2="317" y2="255" marker-end="url(#arrow)"/>
    <line x1="573" y1="255" x2="597" y2="255" marker-end="url(#arrow)"/>
    <line x1="853" y1="255" x2="877" y2="255" marker-end="url(#arrow)"/>
  </g>

  <!-- Footer line -->
  <text x="600" y="378" text-anchor="middle" font-size="14" fill="#7e93b5">
    Physics simulation &#183; Agentic tool use &#183; Scenario retrieval &#183; XGBoost classification &#183; QLoRA + GGUF fine-tuning
  </text>
</svg>
