# Open-weight model fine-tuning configuration (QLoRA + GGUF).
# Author: A Taylor

base_model:
  # Pick an open-weight base. Llama 3.3 70B (gated — set HF_TOKEN) or Qwen2.5 72B.
  model_id: meta-llama/Llama-3.3-70B-Instruct
  # Alternative: Qwen/Qwen2.5-72B-Instruct  (set trust_remote_code: true)
  trust_remote_code: false

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none
  task_type: CAUSAL_LM

training:
  data_dir: data/finetune
  output_dir: results/thermal-agent-lora
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  save_strategy: epoch
  bf16: true
  max_seq_length: 4096
  gradient_checkpointing: true
  optim: paged_adamw_8bit

gguf:
  merged_dir: results/thermal-agent-merged
  output_path: results/thermal-agent.Q4_K_M.gguf
  quant_type: Q4_K_M
  llama_cpp_dir: third_party/llama.cpp
